# 阶段 A：只有 80（Cloudflare 先设 Flexible 联调）
# 证书就位后换成 nginx-api-tls.conf（80 → 301 跳 443，443 用 Origin 证书）

# WebSocket：带 Upgrade 头时回 "upgrade"，否则 close。
# 必须放在 http 上下文中（conf.d/*.conf 属于 http），不能写进 server{}。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream veripaper_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.veripaper.me;

    # 上传上限 30MB（应用侧校验），留 10MB 余量
    client_max_body_size 40m;
    client_body_timeout 120s;

    # 指标不对外
    location = /metrics {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://veripaper_backend;
        proxy_http_version 1.1;

        # WebSocket（任务详情实时进度）：这两个头缺一不可
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务/流式响应不要被 60s 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
