# 阶段 B：Cloudflare Origin 证书 + 80/443 双监听
#
# 为什么 80 不做 301 跳转：Cloudflare 的加密模式由用户切换，
# 若先把 80 改成跳转、CF 还停在 Flexible，会立刻全站 522。
# 这里两个端口都直接反代，切换顺序就不敏感：
#   1) 起这个配置 → 2) 验证本机 443 → 3) 用户把 CF 切 Full (strict)。
# 证书就位后也可以安全回退到 Flexible。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream veripaper_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.veripaper.me;

    client_max_body_size 40m;
    client_body_timeout 120s;

    location = /metrics {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://veripaper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.veripaper.me;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 40m;
    client_body_timeout 120s;

    location = /metrics {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://veripaper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
