# 阶段 B：Cloudflare Origin 证书 + 80/443 双监听
#
# 为什么 80 不做 301 跳转：Cloudflare 的加密模式由用户切换，
# 若先把 80 改成跳转、CF 还停在 Flexible，会立刻全站 522。
# 这里两个端口都直接反代，切换顺序就不敏感：
#   1) 起这个配置 → 2) 验证本机 443 → 3) 用户把 CF 切 Full (strict)。
# 证书就位后也可以安全回退到 Flexible。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ===== 真实客户端 IP（Issue #11 M-2，2026-11-12）=====
#
# 生产链路是 浏览器 → Cloudflare → 本网关 → backend。不做处理的话：
#   `$remote_addr` = Cloudflare 边缘节点 IP → 所有用户共用一个限流桶
#   （实测 Redis key 为 `ratelimit:3600:auth_register:ip:172.18.0.5`，注册 5 次/小时成了全局限额）。
#
# 两条约束缺一不可：
#   1) **只对 Cloudflare 网段**采信 `CF-Connecting-IP`（下面 set_real_ip_from）；
#      直连源站的攻击者不在名单里，它伪造的该头会被忽略，`$remote_addr` 仍是它自己的地址；
#   2) 应用侧只读 `X-Real-IP`（本文件用 `$remote_addr` 无条件覆盖写），**不读 `X-Forwarded-For`**
#      —— XFF 的第一段是客户端自己写的，信它等于谁都能换一个限流桶。
#
# 网段来源 https://www.cloudflare.com/ips/ （2026-11-12 抓取）。CF 增删网段时需要同步；
# 漏更新只会让「新网段来的请求」被当成 CF 节点地址（限流精度下降），不会导致不可用。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
# 递归替换：多级代理时逐跳校验，只接受上面名单里的源
real_ip_recursive on;

# ===== 安全响应头（Issue #11 M-4，2026-11-12）=====
#
# 为什么用 map 分流 CSP，而不是在每个 location 里各写一遍：
# nginx 的 `add_header` 一旦在子级出现，**父级的 add_header 全部不再继承**。
# 想让 `/docs`（Swagger UI）用一套、API 用另一套，若靠 location 覆盖，
# 就得把 6 个头在每个 location 里重复一遍，改漏一处就静默少一层防护。
# 用 map 只改「值」，add_header 仍然只有一份。
#
# 默认策略：API 响应是纯数据，不需要加载任何资源。
map $uri $csp_policy {
    default "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    # Swagger UI / ReDoc 是 FastAPI 直接吐的 HTML：脚本走 jsdelivr CDN，且含内联初始化脚本。
    # 另外 Cloudflare 会给**所有经过它的 HTML 响应**注入 Web Analytics 探针
    # （static.cloudflareinsights.com），不放行就会在控制台刷 CSP 报错。
    ~^/(docs|redoc) "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'";
}

upstream veripaper_backend {
    server backend:8000;
    keepalive 32;
}

# 未知 Host 直接断开连接。
# 为什么需要：Cloudflare 的「悬空 A 记录」检测会用其它 Host 头探测源站，
# 只要源站对任意 Host 都应答，就会被判成「共享 IP 上有人响应」。
# 显式 444 后，只有 api.veripaper.me 才会得到响应（2026-11-10 处置）。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name api.veripaper.me;

    client_max_body_size 40m;
    client_body_timeout 120s;

    # 安全响应头：一律 `always`，4xx/5xx 也要带（探测与攻击最常看到的就是错误响应）。
    # 刻意不加 `Cross-Origin-Resource-Policy: same-origin`：这个 API 本来就要被
    # veripaper.me 跨源调用，写成 same-origin 会把产品自己的前端挡掉。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy $csp_policy always;

    location = /metrics {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://veripaper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.veripaper.me;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 40m;
    client_body_timeout 120s;

    # 与 80 端口同一套（Cloudflare 停在 Flexible 时走的就是这里）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy $csp_policy always;

    location = /metrics {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://veripaper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
