# ECS 专用编排（standalone，不与仓库根 docker-compose.yml 叠加）
#
# 为什么不用 override：
#   1) 根 compose 的 backend `depends_on: chroma(healthy)` 无法用 override **移除**
#      （序列是合并语义），会连带拉起 Chroma，白占 200MB+；
#   2) `ports` 也是序列合并，用 `!reset` 依赖 Compose 2.24+，服务器版本不确定。
#   standalone 只多一份 40 行的定义，换来「启动什么就是什么」，更适合云端本体。
#
# 用法（在仓库根目录）：
#   docker compose -f deploy/ecs/docker-compose.yml up -d postgres redis
#   docker compose -f deploy/ecs/docker-compose.yml up -d backend
#   docker compose -f deploy/ecs/docker-compose.yml up -d gateway
name: veripaper

services:
  postgres:
    # 与 Supabase（PG 17.11）对齐，避免 pg_restore 版本不匹配
    image: pgvector/pgvector:pg17
    container_name: vp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 必填}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 必填}
    # 不发布端口：只有容器网络可达
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    container_name: vp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  backend:
    build:
      # 构建上下文必须是仓库根：Dockerfile 要 COPY config、backend/pyproject.toml，
      # 且 pyproject 的 readme 指向 ../README.md
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        # 美东机器直连官方 PyPI；真实 BGE 嵌入需要 CPU 版 torch 与 RAG 依赖
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        INSTALL_RAG_MODELS: ${INSTALL_RAG_MODELS:-true}
    container_name: vp-backend
    restart: unless-stopped
    # 全部配置走 env_file（.env 里已是 pydantic-settings 的嵌套名），
    # 避免根 compose 那种「白名单漏项」问题
    env_file:
      - ../../.env
    environment:
      HF_HOME: /app/.cache
      # 双核 ECS 上真实嵌入只用单线程，给 PostgreSQL/Redis/网关保留余量
      OMP_NUM_THREADS: "1"
    volumes:
      - uploads:/app/data/uploads
      - artifacts:/app/data/artifacts
      - model_cache:/app/.cache
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    # 只做 API 反代：前端在 Cloudflare Pages，不需要在这里编译前端产物
    image: nginx:alpine
    container_name: vp-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书就位后用 TLS 版（80 也直连反代，Cloudflare 用 Flexible 还是
      # Full(strict) 都不会 522；切换顺序不敏感）
      - ./nginx-api-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  # 每日把本地 PG 备份到七牛云（复用 deploy/db-backup 的镜像与脚本）
  #
  # 为什么不是指向 Supabase 的那份：Supabase 现在只是回滚用的旧库，
  # 生产数据在 vp-postgres 里，备份必须打它。
  db-backup:
    build:
      context: ../..
      dockerfile: deploy/db-backup/Dockerfile
    image: veripaper-db-backup:local
    container_name: vp-db-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      # 容器网络内直连，无 TLS
      PGSSLMODE: disable
      S3_ENDPOINT: ${STORAGE__S3_ENDPOINT:-}
      S3_REGION: ${STORAGE__S3_REGION:-cn-east-1}
      S3_BUCKET: ${STORAGE__S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${STORAGE__S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${STORAGE__S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: db-backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
  artifacts:
  model_cache:
