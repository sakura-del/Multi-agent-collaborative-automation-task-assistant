# 多智能体协作自动化任务助手 - Docker Compose 编排
# 阶段0：PostgreSQL + Redis + Chroma + Nginx + backend 五容器
#
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实密钥
#   2. docker-compose up -d
#   3. 访问 http://localhost (Nginx) 或 http://localhost:8000 (直连后端)

name: multi-agent-assistant

services:
  # ===== PostgreSQL 数据库 =====
  postgres:
    image: postgres:16-alpine
    container_name: maa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maa_secret_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_assistant}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maa} -d ${POSTGRES_DB:-multi_agent_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maa-network

  # ===== Redis 缓存与消息中间件 =====
  redis:
    image: redis:7-alpine
    container_name: maa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maa-network

  # ===== Chroma 向量数据库（阶段5 RAG 使用） =====
  chroma:
    image: chromadb/chroma:0.4.24
    container_name: maa-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maa-network

  # ===== FastAPI 后端 =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maa-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-DEBUG}
      APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maa}:${POSTGRES_PASSWORD:-maa_secret_pwd}@postgres:5432/${POSTGRES_DB:-multi_agent_assistant}
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # 开发模式：挂载源码支持热重载
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./config:/app/../config:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - maa-network

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:1.25-alpine
    container_name: maa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maa-network

networks:
  maa-network:
    driver: bridge

volumes:
  postgres_data:
    name: maa-postgres-data
  redis_data:
    name: maa-redis-data
  chroma_data:
    name: maa-chroma-data
