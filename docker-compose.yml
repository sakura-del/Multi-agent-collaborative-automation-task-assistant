# 多智能体协作自动化任务助手 - Docker Compose 编排
# Plan 1 Task 6：自包含启动
#   - backend 依赖从 pyproject 派生（含 rag-models），迁移由 entrypoint 自动执行
#   - nginx 镜像内构建前端，不再依赖宿主机 frontend/dist
#   - 仅 nginx 暴露主机端口；嵌套环境变量名与 pydantic-settings 对齐（DATABASE__URL 等）
#   - JWT_SECRET_KEY 为必需项，缺失即拒绝启动
#
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实密钥（JWT_SECRET_KEY 必填）
#   2. docker compose up -d --build
#   3. 访问 http://localhost（Nginx 唯一入口）

name: multi-agent-assistant

services:
  # ===== PostgreSQL 数据库 =====
  postgres:
    image: postgres:16-alpine
    container_name: maa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maa_secret_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_assistant}
      TZ: Asia/Shanghai
    ports:
      # 主机端口改为 5433 避免与本机其他 PG 容器（vector_pg）冲突；
      # 容器间通信仍走 postgres:5432，无需改 backend 配置
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maa} -d ${POSTGRES_DB:-multi_agent_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maa-network

  # ===== Redis 缓存与消息中间件 =====
  redis:
    image: redis:7-alpine
    container_name: maa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maa-network

  # ===== Chroma 向量数据库（阶段5 RAG 使用） =====
  # ⚠️ 版本必须与 backend 依赖 chromadb 一致（pyproject.toml 锁定 ==1.5.9）。
  # 曾用 0.4.24 而客户端是 1.5.9 → 跨大版本不兼容（HttpClient 报 {"detail":"Not Found"}）。
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: maa-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # chromadb 1.x 镜像**不含 python/curl/wget**（实测 `command -v python` → NO_PYTHON），
      # 故用 bash 内置 /dev/tcp 探测 v2 heartbeat（1.x 起路径为 /api/v2/heartbeat）。
      # ⚠️ 必须用 `CMD` + 显式 `bash -c`：`CMD-SHELL` 走 /bin/sh（dash），
      # 而 /dev/tcp 是 bash 特性，dash 下会报 "Directory nonexistent"。
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q 200",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maa-network

  # ===== FastAPI 后端 =====
  backend:
    build:
      # pyproject readme 指向 ../README.md，build context 必须是仓库根
      context: .
      dockerfile: backend/Dockerfile
    container_name: maa-backend
    restart: unless-stopped
    environment:
      # 嵌套配置：pydantic-settings 以 __ 为分隔符映射到 settings.database.url 等
      DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-maa}:${POSTGRES_PASSWORD:-maa_secret_pwd}@postgres:5432/${POSTGRES_DB:-multi_agent_assistant}
      REDIS__URL: redis://redis:6379/0
      RAG__CHROMA_HOST: chroma
      RAG__CHROMA_PORT: "8000"
      # 受控存储目录（容器内 /app/data，命名卷持久化）
      APP__UPLOAD_ROOT: /app/data/uploads
      APP__ARTIFACT_ROOT: /app/data/artifacts
      # 嵌入/重排模型缓存（HuggingFace 缓存目录指向命名卷，避免重复下载）
      HF_HOME: /app/.cache
      # 嵌入/重排：默认 Mock（自包含、离线、快）；设为 0 启用真实 BGE 模型（首次下载约 2.5GB 权重）
      RAG_EMBEDDING_MOCK: ${RAG_EMBEDDING_MOCK:-1}
      RAG_RERANKER_MOCK: ${RAG_RERANKER_MOCK:-1}
      # JWT 密钥为必需项：.env 缺失时 compose 直接报错，避免回退弱密钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in .env}
      # LLM 配置：必须用嵌套名（pydantic-settings 的 __ 分隔）才能被应用读到；
      # 扁平 OPENAI_API_KEY 只是 SDK 回退，值必须与嵌套项一致，避免误用占位密钥。
      LLM__DEFAULT_PROVIDER: ${LLM__DEFAULT_PROVIDER:-openai}
      LLM__DEFAULT_MODEL: ${LLM__DEFAULT_MODEL:-gpt-6-luna}
      LLM__OPENAI_API_KEY: ${LLM__OPENAI_API_KEY:-}
      LLM__OPENAI_BASE_URL: ${LLM__OPENAI_BASE_URL:-https://api.openai.com/v1}
      # 单次 LLM 请求超时（秒）。默认 30 对网页交互合适，但**跑实验矩阵不够**：
      # 服务器负载高时 gpt-6-luna 经常 >30s，导致节点重试耗尽、任务卡在 reviewing。
      # 实测（2026-10-22 pilot）158 次 `Request timed out`，4/8 run 失败。
      # 实验时用 `LLM__REQUEST_TIMEOUT=120` 覆盖；网页场景保持默认。
      LLM__REQUEST_TIMEOUT: ${LLM__REQUEST_TIMEOUT:-30}
      LLM__MAX_RETRIES: ${LLM__MAX_RETRIES:-3}
      # DeepSeek 保底通道（OpenAI 兼容协议）：主模型 5xx/超时后由 fallback_chain 接管
      LLM__DEEPSEEK_API_KEY: ${LLM__DEEPSEEK_API_KEY:-}
      LLM__DEEPSEEK_BASE_URL: ${LLM__DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${LLM__OPENAI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    # 不暴露主机端口：所有流量经 Nginx；调试可临时加回 "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
      - artifacts_data:/app/data/artifacts
      # 嵌入/重排模型缓存（首次拉取后复用，避免重复下载）
      - model_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      # 就绪探针真实探测 DB/Redis/Chroma，任一失败容器标记 unhealthy
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - maa-network

  # ===== Nginx 反向代理（唯一对外入口） =====
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: maa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maa-network

networks:
  maa-network:
    driver: bridge

volumes:
  postgres_data:
    name: maa-postgres-data
  redis_data:
    name: maa-redis-data
  chroma_data:
    name: maa-chroma-data
  uploads_data:
    name: maa-uploads-data
  artifacts_data:
    name: maa-artifacts-data
  model_cache:
    name: maa-model-cache
