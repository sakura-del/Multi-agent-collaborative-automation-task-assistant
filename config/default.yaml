# 默认配置文件（被环境变量覆盖）
# 阶段0：仅初始化基础结构，后续阶段按需扩展

app:
  name: "多智能体协作自动化任务助手"
  env: "development"          # development / staging / production
  debug: true
  host: "0.0.0.0"
  port: 8000
  log_level: "DEBUG"
  log_format: "json"          # json / console
  # 文档上传与任务产物的受控存储目录（按 user_id 划分子目录）
  upload_root: "/app/data/uploads"
  artifact_root: "/app/data/artifacts"
  max_upload_bytes: 31457280  # 30 MB

database:
  pool_size: 10
  max_overflow: 20
  pool_recycle: 1800
  echo: false                 # SQL 日志（生产关闭）

redis:
  max_connections: 50
  default_ttl: 3600

llm:
  # 默认模型：正式实验模型（gpt-6-luna，经 model.rhzy.ai 兼容端点提供；
  # 该端点 group 不支持 gpt-4o / gpt-4o-mini，详见执行注释）
  default_provider: "openai"
  default_model: "gpt-6-luna"
  request_timeout: 30
  max_retries: 3
  # 分级使用策略（阶段0任务4）
  cost_budget:
    daily_token_limit: 1000000
    monthly_token_limit: 20000000
    alert_threshold: 0.8
  # 降级链：主模型超时/失败后依次尝试
  fallback_chain:
    - provider: "openai"
      model: "gpt-4o-mini"
    - provider: "glm"
      model: "glm-4-flash"
    - provider: "qwen"
      model: "qwen-turbo"

rag:
  embedding_model: "BAAI/bge-large-zh"
  reranker_model: "BAAI/bge-reranker-large"
  chunk_size: 512
  chunk_overlap: 64
  retrieval_top_k: 10
  rerank_top_k: 5
  # Chroma 服务地址（容器内走服务名 chroma；本地开发可改为 localhost）
  chroma_host: "chroma"
  chroma_port: 8000

agent:
  # Agent 默认能力画像（阶段3填充）
  max_concurrency: 4
  message_timeout: 60

orchestration:
  # DAG 调度参数（阶段4填充）
  max_retry: 3
  retry_backoff_base: 1
  retry_backoff_factor: 3
