# 默认配置文件（被环境变量覆盖）
# 阶段0：仅初始化基础结构，后续阶段按需扩展

app:
  name: "VeriPaper"
  env: "development"          # development / staging / production
  debug: true
  host: "0.0.0.0"
  port: 8000
  log_level: "DEBUG"
  log_format: "json"          # json / console
  # 文档上传与任务产物的受控存储目录（按 user_id 划分子目录）
  upload_root: "/app/data/uploads"
  artifact_root: "/app/data/artifacts"
  max_upload_bytes: 31457280  # 30 MB

# 文档存储：local（本地磁盘，默认）| s3（七牛云 Kodo / R2 等 S3 兼容服务）
# 凭据只放 .env（600），不要写进本文件；这里只给安全默认值。
storage:
  backend: "local"
  s3_endpoint: ""
  s3_region: "cn-east-1"
  s3_bucket: ""
  s3_access_key_id: ""
  s3_secret_access_key: ""
  s3_prefix: "uploads"
  # 七牛云只接受 virtual-hosted（bucket.endpoint/key），path 样式会 SignatureDoesNotMatch
  s3_addressing_style: "virtual"
  presign_expires_seconds: 900

database:
  pool_size: 10
  max_overflow: 20
  pool_recycle: 1800
  echo: false                 # SQL 日志（生产关闭）
  # ===== Supabase（迁移后新增；本地 postgres 保持 false）=====
  # 开启后 asyncpg 传 ssl="require"（DSN 里已写 sslmode 时不要重复开）
  ssl_require: false
  # transaction pooler（端口 6543）不支持 prepared statement：
  # 开启后同时关闭 asyncpg 与 SQLAlchemy 两层语句缓存
  disable_prepared_statements: false

redis:
  max_connections: 50
  default_ttl: 3600

llm:
  # 默认模型（2026-10-27 切换，实测依据见 execution-notes）：
  #   model.rhzy.ai/v1 上共 21 个模型，只有 3 个真正可用：
  #     workbuddy-ai/deepseek-v4.1-flash    1.5s  ✅ 首选
  #     workbuddy-ai/deepseek-v4.1-flash-sg 1.6s  ✅ 备选
  #     workbuddy-ai/hy3                    2.0s  ⚠️ 内容在 reasoning_content 里，不适配
  #   qoder/qfmodel 与 qoder/dfmodel 请求超时（180s 无响应）；
  #   opencode-zen-free/* 全部 502 upstream_error。
  # 旧值 gpt-6-luna 在该端点已不可用。
  default_provider: "openai"
  default_model: "workbuddy-ai/deepseek-v4.1-flash"
  request_timeout: 30
  max_retries: 3
  # 分级使用策略（阶段0任务4）
  cost_budget:
    daily_token_limit: 1000000
    monthly_token_limit: 20000000
    alert_threshold: 0.8
  # 降级链：主模型超时/失败后依次尝试。
  #
  # 2026-10-27 逐个实测（容器内直接调各 provider）：
  #   deepseek/deepseek-chat  ✅ 可用（注意：实际路由到 deepseek-flash）
  #   glm/glm-4-flash         ❌ 401 令牌已过期
  #   qwen/qwen-turbo         ❌ 401 Incorrect API key
  #
  # 所以只保留**实测可用**的项。无效项留着不是"多一层兜底"，
  # 而是降级时会先浪费一次 401 才轮到下一个 —— 更慢，且日志里全是噪声。
  # glm/qwen 的 key 是占位符（your-glm-... / your-qwen-...），
  # 配了真 key 后再加回来。
  fallback_chain:
    - provider: "openai"
      model: "workbuddy-ai/deepseek-v4.1-flash-sg"
    - provider: "deepseek"
      model: "deepseek-chat"

rag:
  embedding_model: "BAAI/bge-large-zh"
  reranker_model: "BAAI/bge-reranker-large"
  chunk_size: 512
  chunk_overlap: 64
  retrieval_top_k: 10
  rerank_top_k: 5
  # Chroma 服务地址。**留空 = 不连服务端**（本地嵌入/内存模式）。
  # 只有 docker-compose 显式注入 RAG__CHROMA_HOST=chroma 时才走 HTTP 客户端。
  # 历史缺陷：此处曾是 "chroma"（容器 DNS 名），导致本地开发/CI 试图解析不存在的主机，
  # 单测里 `init_kb()` 不传 chroma_persist_dir 时会去连它而报 getaddrinfo failed。
  chroma_host: ""
  chroma_port: 8000
  # ===== 向量后端（2026-11 迁移 Supabase pgvector）=====
  # chroma = 旧实现（回滚开关，数据在 maa-chroma-data 卷）；
  # pgvector = Supabase PostgreSQL + pgvector。
  # **默认 chroma**：升级本身不改行为，切换是显式动作；回滚也是显式动作。
  vector_backend: "chroma"
  # 连接串留空 = 复用 database.url（整库迁 Supabase 后同源）。
  # ⚠️ 真实 DSN 只写 .env（RAG__PGVECTOR_DSN），不要写进本文件。
  pgvector_dsn: ""
  pgvector_table: "knowledge_vectors"
  # hnsw：无需训练、增量友好（2.8 万行规模首选）；ivfflat：省内存但需按数据量调 lists
  pgvector_index: "hnsw"
  pgvector_hnsw_m: 16
  pgvector_hnsw_ef_construction: 64
  pgvector_ivfflat_lists: 100
  # 同步连接池（向量检索是同步调用）：按并发检索量给，不按请求量
  pgvector_pool_min_size: 1
  pgvector_pool_max_size: 5
  # 15s：实测国内→Supabase eu-west-1 单次建连 6~8s；池等待时间必须大于建连时间
  pgvector_pool_timeout: 15.0
  pgvector_connect_timeout: 15
  pgvector_statement_timeout_ms: 15000
  # 留空 = 由 DSN 决定；Supabase 建议 "require"
  pgvector_sslmode: ""
  # 默认开：transaction pooler 不支持预编译语句；且通用计划用不上 HNSW 有序扫描
  pgvector_disable_prepared_statements: true
  # 仅集成测试/临时库：允许运行时建表建索引（生产由 alembic 负责）
  pgvector_auto_migrate: false

agent:
  # Agent 默认能力画像（阶段3填充）
  max_concurrency: 4
  message_timeout: 60

orchestration:
  # DAG 调度参数（阶段4填充）
  max_retry: 3
  retry_backoff_base: 1
  retry_backoff_factor: 3

reference_verification:
  # 引用真实性核验（Issue #3）：与 CrossRef / OpenAlex 比对参考文献元数据，产出四态结论
  enabled: true
  mode: "report"              # off / report / enforce；report 为 advisory（只记录不影响通过）
  intercept_unverified: false # 开启时未通过核验的条目剔出参考文献列表
  similarity_threshold: 0.90  # 标题相似度阈值，低于该值视为「未找到」
  year_tolerance: 1           # 年份偏差容差（年）
  cache_ttl_seconds: 604800   # 核验结论缓存 TTL（秒），默认 7 天
  request_timeout_seconds: 20.0
  total_timeout_seconds: 20.0  # 单节点核验总预算（秒）；超预算则全部候选降级为「未核验」
  # 核验外呼并发上限。⚠️ 未配 contact_email 时处于 OpenAlex 公共池（约 1 req/s），
  # 并发过高必然触发 429；配好 contact_email 进入 polite pool 后可适当调高。
  max_concurrency: 2
  verify_offline_tasks: false # 离线清单（offline_dataset=true）任务是否也做外部核验：默认零外呼
  # 礼貌池联系方式（CrossRef/OpenAlex 的 polite pool）。
  # ✅ 配置优先级缺陷已修复（2026-10-19）：本文件现在只是**最低优先级基线**，
  # 环境变量可以覆盖它——推荐在 `.env` 里写 `REFERENCE_VERIFICATION__CONTACT_EMAIL=you@example.org`。
  # 留空则处于公共池（约 1 req/s），此时应保持 max_concurrency 较低以避免 429。
  contact_email: ""
  user_agent: "maa-literature-review/0.1 (+https://github.com/sakura-del/Multi-agent-collaborative-automation-task-assistant)"
  max_retries: 1              # 429/5xx 重试次数，重试耗尽后降级为「未核验」

# ===== 邮件与账号生命周期（Phase 1 P1-C）=====
# 设计原则：默认 sender=logging 只把验证/重置链接写日志，**不阻塞注册**；
# 配好 SMTP（建议写 .env，不要提交密码）后自动切换真实投递。
email:
  sender: "logging"                  # logging | smtp
  from_address: "no-reply@localhost"
  smtp_host: ""                      # 空 = 未配置 → 只记日志，不抛错
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""                  # ⚠️ 只进 .env：EMAIL__SMTP_PASSWORD=...
  smtp_use_tls: true
  verify_token_ttl_hours: 24
  reset_token_ttl_hours: 24
  frontend_base_url: "http://localhost:5173"

# ===== 速率限制与按用户配额（Phase 1 P1-D）=====
# 各动作独立限额；Redis 不可用时全部 fail-open（放行），限流组件故障不得拖垮服务。
rate_limit:
  enabled: true
  backend: "redis"                   # redis 多进程共享；memory 单进程（测试/单机）
  key_prefix: "ratelimit"
  trust_proxy: false                 # 是否信任 X-Forwarded-For（默认 False 防伪造）
  rules:
    auth_login: { limit: 10, window_seconds: 60 }
    auth_register: { limit: 5, window_seconds: 3600 }
    task_create: { limit: 30, window_seconds: 3600 }
    task_control: { limit: 60, window_seconds: 3600 }   # 确认/控制/WS ticket
    upload: { limit: 20, window_seconds: 3600 }
    search: { limit: 60, window_seconds: 60 }
    verify: { limit: 30, window_seconds: 60 }
    template_write: { limit: 20, window_seconds: 3600 }  # 上传/删除（解压校验）
    template_render: { limit: 10, window_seconds: 60 }   # 渲染（docxtpl 重打包，开销最大）

quota:
  enabled: true
  daily_token_limit: 1000000         # -1 = 不限制；0 = 全拒；与 llm.cost_budget 对齐
  window_seconds: 86400              # 按 UTC 日重置
  key_prefix: "quota"

