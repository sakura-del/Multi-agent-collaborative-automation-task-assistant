# Alembic 数据库迁移配置
# 阶段0任务2：建立迁移管理基础，阶段1开始填充 ORM 模型与首版迁移

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板：使用异步模式
# 实际数据库 URL 在 env.py 中从应用 settings 读取，便于复用配置
sqlalchemy.url =

# 模板配置
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
