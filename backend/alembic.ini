# Alembic database migration config
# Phase 0 task 2: migration framework setup.
# ORM models & first migration will be added in phase 1 task 1.5.

[alembic]
# migration script directory
script_location = alembic

# async mode template
# actual database URL is injected from app settings in env.py
sqlalchemy.url =

# 模板配置
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
