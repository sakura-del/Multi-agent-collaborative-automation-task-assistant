[project]
name = "multi-agent-assistant"
version = "0.1.0"
description = "多智能体协作自动化任务助手 - 后端应用"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Academic" }
authors = [{ name = "sakura-del" }]
# 主要依赖：FastAPI / SQLAlchemy / Redis / Pydantic / LLM SDK / RAG
dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # 配置与校验
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",

    # 数据库
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aioredis>=2.0.1",
    "redis>=5.0.0",

    # 日志与追踪
    "structlog>=24.1.0",

    # 鉴权
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",

    # LLM 层
    # 说明（Plan 5 Task 4）：早期声明的 langchain / langchain-community / tiktoken
    # 从未被 app 或测试导入，已移除，避免 CI 与镜像安装无用的重依赖。
    "openai>=1.12.0",
    "jinja2>=3.1.3",

    # RAG 知识库层
    # ⚠️ chromadb 必须与服务端镜像版本一致（docker-compose.yml 的 chromadb/chroma:1.5.9）。
    # 曾用 `>=0.4.22`：CI 装到 1.5.9 而镜像还是 0.4.24 → 跨大版本不兼容
    # （HttpClient 报 `{"detail":"Not Found"}`），smoke 因此全红。升级时两端一起改。
    "chromadb==1.5.9",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",

    # 文档解析
    "PyMuPDF>=1.23.26",
    "python-docx>=1.1.0",
    "markdown>=3.5.2",

    # NOTE: beautifulsoup4 / openpyxl / pandoc 同样未被代码引用，已移除；
    # 若后续新增网页抓取或表格导出功能，请按需加回并补测试。

    # DAG 引擎
    "networkx>=3.2.1",

    # HTTP 客户端 / 工具
    "httpx>=0.26.0",
    "tenacity>=8.2.3",

    # CSL 引用渲染（Issue #4 / ADR 0001 Option C）
    # 选型理由与许可证核实见 docs/adr/0001-csl-bilingual-strategy.md：
    # citeproc-py 为 BSD-2-Clause-Views、纯 Python；双语靠应用层逐条 locale 切换实现。
    # 上游自述 CSL 覆盖率约 60% + Alpha，故必须用 golden 测试兜住我们真正用到的构造；
    # 失败时的路线内逃生通道是 pandoc --citeproc（不回到 citeproc-js）。
    "citeproc-py==0.11.1",

    # 中文著者字顺（Issue #4 剩余项）：author-date 排序按拼音而非 Unicode 码位。
    # pypinyin 为 MIT、纯 Python、无运行时依赖（~840KB）；未安装时排序自动退化为码位（不崩）。
    "pypinyin==0.55.0",
]

[project.optional-dependencies]
# RAG 真实模型：嵌入（sentence-transformers）+ 重排（FlagEmbedding）。
# 体量大（含 torch 等），后端镜像安装本组使 Compose 自包含可离线跑真实模型；
# CI 用 Mock 模式（RAG_EMBEDDING_MOCK=1 / RAG_RERANKER_MOCK=1）无需安装。
rag-models = [
    "sentence-transformers>=2.4.0",
    "FlagEmbedding>=1.2.10",
]

# 实验依赖（Plan 5 Task 5）：只在跑实验/出报告时安装，产品运行不需要
evaluation = [
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "matplotlib>=3.9,<4",
]

# 开发依赖：测试、格式化、类型检查
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",  # 测试环境用 SQLite 内存库替代 PostgreSQL
    "fakeredis>=2.21.0",  # 测试环境用 fake redis 替代真实 Redis
    "lupa>=2.0",  # fakeredis 的 Lua eval 支持（分布式锁测试需要）
    # ⚠️ 代码质量工具必须**锁定版本**（用 ==，不用 >=）：
    # CI 通过 `pip install -e ".[dev]"` 装依赖，宽松下限会让 CI 装到最新版，
    # 而本地 venv 是旧版 → 「本地全绿、CI 红」的假象。曾因 black 24→26 的
    # 「hug 括号」规则变更导致 10+ 个提交全部 CI 失败（2026-10-19 修复）。
    # 升级流程：改这里的版本 → 本地 `pip install -e ".[dev]"` → 跑 black/ruff/mypy
    # → 提交格式化差异，保证 CI 与本地始终同一版本。
    "black==26.10.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pre-commit>=3.6.2",
]

[project.urls]
Repository = "https://github.com/sakura-del/Multi-agent-collaborative-automation-task-assistant"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ===== Black 代码格式化 =====
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
  | alembic/versions
)/
'''

# ===== Ruff Linter =====
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 行长由 Black 处理
    # 中文项目常见误报：RUF001/002/003 把中文全角标点识别为"歧义字符"，
    # 中文文档/注释/字符串中本就需要全角标点，禁用这三条规则
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    # FastAPI 标准模式：在默认参数中调用 Depends()，B008 误报
    "B008",   # function-call-in-default-argument
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ===== Pytest =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: 标记运行较慢的测试",
    "integration: 集成测试，需要外部服务",
]

# ===== Mypy 类型检查 =====
[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]
