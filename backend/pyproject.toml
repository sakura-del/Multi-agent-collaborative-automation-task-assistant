[project]
name = "multi-agent-assistant"
version = "0.1.0"
description = "多智能体协作自动化任务助手 - 后端应用"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Academic" }
authors = [{ name = "sakura-del" }]
# 主要依赖：FastAPI / SQLAlchemy / Redis / Pydantic / LLM SDK / RAG
dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # 配置与校验
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",

    # 数据库
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aioredis>=2.0.1",
    "redis>=5.0.0",

    # 日志与追踪
    "structlog>=24.1.0",

    # 鉴权
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # LLM 层
    "openai>=1.12.0",
    "langchain>=0.1.5",
    "langchain-community>=0.0.20",
    "tiktoken>=0.6.0",
    "jinja2>=3.1.3",

    # RAG 知识库层
    "chromadb>=0.4.22",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "sentence-transformers>=2.4.0",
    "FlagEmbedding>=1.2.10",

    # 文档解析
    "PyMuPDF>=1.23.26",
    "python-docx>=1.1.0",
    "markdown>=3.5.2",

    # 工具层
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "openpyxl>=3.1.2",
    "pandoc>=2.3",

    # DAG 引擎
    "networkx>=3.2.1",

    # HTTP 客户端 / 工具
    "httpx>=0.26.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
# 开发依赖：测试、格式化、类型检查
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",  # 测试环境用 SQLite 内存库替代 PostgreSQL
    "black>=24.2.0",
    "ruff>=0.2.2",
    "mypy>=1.8.0",
    "pre-commit>=3.6.2",
]

[project.urls]
Repository = "https://github.com/sakura-del/Multi-agent-collaborative-automation-task-assistant"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ===== Black 代码格式化 =====
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
  | alembic/versions
)/
'''

# ===== Ruff Linter =====
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = ["E501"]  # 行长由 Black 处理

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ===== Pytest =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: 标记运行较慢的测试",
    "integration: 集成测试，需要外部服务",
]

# ===== Mypy 类型检查 =====
[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]
