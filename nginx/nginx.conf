# Nginx 反向代理配置
# Plan 1 Task 6：/api/ 统一承载 HTTP 与 WebSocket（Upgrade 头经 map 处理），
# 前端静态资源由镜像内构建产物直接服务（不再依赖宿主机挂载）。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # WebSocket 升级头：无 Upgrade 请求头时保持默认连接行为
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 日志格式（结构化便于 ELK 采集）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;  # 允许上传较大文档（RAG 知识库）

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 后端服务上游
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 前端静态资源（镜像内 npm run build 产物）
        root /usr/share/nginx/html;
        index index.html;

        # API 反向代理：同时支持 HTTP 与 WebSocket（/api/v1/tasks/{id}/ws）
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;  # WebSocket 长连接
        }

        # OpenAPI 文档与 Swagger UI
        location /docs {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # Prometheus 指标（Phase 2 可观测性）
        # 精确匹配 `= /metrics`，不匹配 /metrics 开头的任何其他路径（避免误代理）。
        #
        # ⚠️ 部署约束：该端点**无鉴权**（Prometheus 抓取器不带业务 token），
        # 因此生产环境必须靠网络层隔离 —— 只在受信内网暴露，或在外层网关上加
        # IP 白名单（见 docs/runbooks/observability.md）。
        location = /metrics {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            # 指标里不应有敏感信息，但额外禁止缓存：抓取必须拿到实时值
            add_header Cache-Control "no-store" always;
        }

        # 前端 SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 健康检查
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
