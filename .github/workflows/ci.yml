# CI（2026-11-12 重构：按改动选测试）
#
# ## 为什么不再每个 push 都跑全量
#
# 3209 条用例本地 19 分钟、GitHub 2 核 runner 超过 45 分钟。每个 push 都等一次的结果是：
# 反馈慢到没人愿意看，真红的时候反而被忽略。现在拆成两条：
#
# - **本 workflow（push/PR）**：lint + **与改动相关**的测试 + 受影响的构建/迁移检查，
#   目标是 3~8 分钟出结果；
# - **`nightly.yml`（每天 03:00 JST）**：全量 + 覆盖率 ≥80% 硬门禁。
#
# 选片规则见 `scripts/ci/select_tests.py`：全局前提（core/db/main/alembic/config/pyproject）
# 改动 → 全量；未映射的新模块 → 全量；只有文档/前端 → 不跑后端测试。
#
# ## 这个取舍的代价（写在明处）
#
# 选片器漏判时，push 的 CI 会绿而全量其实红。三层兜底：
# 1. 夜间全量必跑；
# 2. 部署后立刻健康检查 + 冒烟，失败自动回滚（`deploy.yml`）；
# 3. `backend/tests/test_ci_selection.py` 校验映射表里每个路径都真实存在。
#
# ## 每个作业都必须有 timeout-minutes（2026-10-27 踩到）
#
# 不配就是 6 小时默认值；配合 `cancel-in-progress`，卡死的 run 会白占时间还被下一次 push 取消，
# 等于「看着一直在跑、实际什么都没验」。

name: CI

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # 先算「这次改了什么」，后面所有作业靠它决定跑不跑
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.base.outputs.value }}
      mode: ${{ steps.select.outputs.mode }}
      frontend: ${{ steps.select.outputs.frontend }}
      needs_build: ${{ steps.select.outputs.needs_build }}
      summary: ${{ steps.select.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定比较基准
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "value=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: 选片
        id: select
        run: |
          python3 scripts/ci/select_tests.py --base "${{ steps.base.outputs.value }}" --format json > /tmp/selection.json
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json

          data = json.load(open("/tmp/selection.json"))
          files = data.get("files") or []
          frontend = any(f.startswith("frontend/") for f in files)
          needs_build = any(
              f.startswith(("backend/", "deploy/", "docker/"))
              or f.endswith("Dockerfile")
              or f.startswith("docker-compose")
              for f in files
          )
          print(f"mode={data['mode']}")
          print(f"frontend={'true' if frontend else 'false'}")
          print(f"needs_build={'true' if needs_build else 'false'}")
          print(f"summary={data['reason']}")
          PY
          tail -4 "$GITHUB_OUTPUT"

  lint:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 实测 1m43s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chroma]"

      - name: Black (format check)
        working-directory: backend
        run: black --check app tests evaluation

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check app tests evaluation

      - name: Mypy (type check, blocking)
        working-directory: backend
        run: mypy app evaluation

  test:
    name: Affected Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    # 纯文档/前端改动不跑后端测试
    if: needs.changes.outputs.mode != 'none'
    # 25 → 50 分钟（2026-11-13 实测）：全量模式（改 core/db/config/alembic 触发）
    # 在 2 核 runner 上 25 分钟被 cancel，日志停在半途、看起来像卡死。
    # 本地同一套用例 20m05s；runner 约 2 倍慢。若再次逼近上限，应按前缀拆 job，
    # 不要继续加时间（AGENTS §5 #58）。
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chroma]"

      # 覆盖率不在这一步：跑部分文件算出的覆盖率没有意义，低于阈值只会误杀。
      # 全量 + 覆盖率在 nightly.yml。
      - name: Run affected tests
        env:
          APP_ENV: test
          DATABASE__URL: "sqlite+aiosqlite:///:memory:"
          REDIS__URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production"
          RAG_EMBEDDING_MOCK: "1"
          RAG_RERANKER_MOCK: "1"
        run: |
          python scripts/ci/run_selected_tests.py --base "${{ needs.changes.outputs.base }}"

  migration:
    name: Alembic Round-Trip (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.mode != 'none'
    timeout-minutes: 20  # 实测 1m41s
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maa
          POSTGRES_PASSWORD: maa_secret_pwd
          POSTGRES_DB: multi_agent_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maa -d multi_agent_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE__URL: "postgresql+asyncpg://maa:maa_secret_pwd@localhost:5432/multi_agent_assistant"
      REDIS__URL: "redis://localhost:6379/0"
      JWT_SECRET_KEY: "ci-test-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chroma]"

      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head

      - name: Downgrade one revision
        working-directory: backend
        run: alembic downgrade -1

      - name: Upgrade back to head
        working-directory: backend
        run: alembic upgrade head

      - name: 集成用例（需要真实 PostgreSQL）
        working-directory: backend
        run: pytest tests/test_task_repository.py -m integration -q

  frontend:
    name: Frontend Unit, Types & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20  # 实测 1m24s
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --run

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Build (vite)
        run: npm run build

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.needs_build == 'true'
    # 实测 28s（缓存命中）~ 4m47s（冷缓存），差异大所以留足余量
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: maa-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build smoke client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/smoke/Dockerfile
          push: false
          tags: maa-smoke:ci

  # 浏览器级验收（Issue #15 P1）：页面打的是**真实后端**，不是 mock。
  #
  # 为什么单独起栈而不复用 smoke 作业：
  # smoke 脚本退出时会 `down --volumes`，跨作业共享容器不可靠；这里用
  # project=maa-e2e + 冒烟 override（高位端口 48082）自建自拆，失败不污染生产。
  #
  # 账号：CI 里现注册一个随机用户（注册即用，登录不要求邮箱已验证）。
  # 只跑 model-settings.spec.ts：其余 E2E 依赖生产数据/固定账号，不适合 CI。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [changes]
    # 后端或前端任一有改动都跑：页面操作会穿透到真实 API
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.mode != 'none'
    timeout-minutes: 40  # 含一次全栈构建；实测待补
    env:
      JWT_SECRET_KEY: ci-e2e-secret-not-for-production
      # 测试专用固定值（32 字节，公开在仓库里也无所谓）：BYOK 凭据加密主密钥。
      # 不配的话 /llm-credentials 返回 503，E2E 会以「功能未启用」失败。
      SECRETS__ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      POSTGRES_PASSWORD: e2e_secret_pwd
      PIP_INDEX_URL: https://pypi.org/simple
      E2E_BASE_URL: http://127.0.0.1:48082
      E2E_DEMO_PASSWORD: ci-e2e-pass-7QmZ
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated stack (project=maa-e2e)
        run: |
          docker compose -p maa-e2e -f docker-compose.yml -f docker-compose.smoke.yml \
            up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL/api/v1/health/ready"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "栈在 5 分钟内未就绪" >&2
          exit 1

      - name: Register throwaway account
        run: |
          ACCOUNT="e2e$(date +%s)"
          curl -fsS -X POST "$E2E_BASE_URL/api/v1/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$ACCOUNT\",\"email\":\"$ACCOUNT@example.com\",\"password\":\"$E2E_DEMO_PASSWORD\"}" \
            > /dev/null
          echo "E2E_DEMO_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run model settings E2E
        working-directory: frontend
        run: npx playwright test e2e/model-settings.spec.ts --project=chromium

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -p maa-e2e -f docker-compose.yml -f docker-compose.smoke.yml \
            logs --tail 150 backend nginx || true

      - name: Tear down stack
        if: always()
        run: |
          docker compose -p maa-e2e -f docker-compose.yml -f docker-compose.smoke.yml \
            down --volumes --remove-orphans || true

  smoke:
    name: Compose Release Smoke
    runs-on: ubuntu-latest
    needs: [changes, test]
    # 后端有改动才做全链路冒烟；文档/前端改动跳过
    if: needs.changes.outputs.mode != 'none'
    timeout-minutes: 30  # 实测 3m31s
    steps:
      - uses: actions/checkout@v4

      - name: Run compose smoke (isolated project maa-test)
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -p maa-test -f docker-compose.yml -f docker-compose.smoke.yml --profile test logs --tail 120 || true

  # 汇总成单一检查名，便于分支保护只勾一项；上游失败或跳过都在这里体现。
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [changes, lint, test, migration, frontend, build-check, smoke, e2e]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 判定
        run: |
          echo "选片结果: ${{ needs.changes.outputs.summary }}"
          echo "后端模式: ${{ needs.changes.outputs.mode }}"
          fail=0
          for item in \
            "lint=${{ needs.lint.result }}" \
            "test=${{ needs.test.result }}" \
            "migration=${{ needs.migration.result }}" \
            "frontend=${{ needs.frontend.result }}" \
            "build-check=${{ needs.build-check.result }}" \
            "smoke=${{ needs.smoke.result }}" \
            "e2e=${{ needs.e2e.result }}"; do
            name="${item%%=*}"; result="${item#*=}"
            echo "$name: $result"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name 未通过（$result）"; fail=1 ;;
            esac
          done
          exit $fail
