# 多智能体协作自动化任务助手 - CI 流水线（Plan 5 Task 4）
#
# 门禁原则：任何检查失败即阻断合并（不存在 `|| true` 或 `continue-on-error`）。
# 依赖唯一来源是 backend/pyproject.toml（`pip install -e ".[dev,chroma]"`），
# 不再在 workflow 里手工维护第三方包清单。
#
# 作业图：
#   lint ─┬─> test（覆盖率 ≥80%）
#         ├─> migration（Alembic 升降级往返，PostgreSQL 16）
#         └─> frontend（Vitest + vue-tsc + vite build）
#   build-check（Dockerfile 可构建）
#   smoke（需要 test + frontend 通过，验证 Compose 全链路）
#
# ## 每个作业都必须有 timeout-minutes（2026-10-27 实测踩到）
#
# 不配超时就是 GitHub 默认的 **6 小时**。2026-10-27 一次纯文档提交里，
# `test` 作业的 pytest 步骤卡了 **42 分钟**（正常 5m35s），我手动取消并重跑，
# 同一作业 5m35s 正常完成 —— 是 runner 侧卡住，不是代码问题。
#
# 没有超时的话，这种卡死会白占 6 小时，而 CI 的 `concurrency.cancel-in-progress`
# 又会让**后续 push 把卡住的 run 取消**，等于「看着一直在跑、实际什么都没验」。
#
# 取值 = 实测最慢值 × 约 3~5 倍余量，既能容忍 runner 抖动，又能在真卡死时
# 尽快失败而不是挂到 6 小时。

name: CI

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 实测 1m22s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # 依赖唯一来源：pyproject.toml；重型真实模型包在 rag-models，CI 不安装
          pip install -e ".[dev,chroma]"

      - name: Black (format check)
        working-directory: backend
        run: black --check app tests evaluation

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check app tests evaluation

      - name: Mypy (type check, blocking)
        working-directory: backend
        run: mypy app evaluation

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    # 实测 5m35s。卡死时 30 分钟失败，而不是挂到 GitHub 默认的 6 小时。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chroma]"

      - name: Run pytest with coverage gate (>=80%)
        working-directory: backend
        env:
          APP_ENV: test
          # pydantic-settings 嵌套分隔符 __ 映射 settings.database.url
          DATABASE__URL: "sqlite+aiosqlite:///:memory:"
          REDIS__URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production"
          RAG_EMBEDDING_MOCK: "1"
          RAG_RERANKER_MOCK: "1"
        run: |
          pytest tests \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  migration:
    name: Alembic Round-Trip (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20  # 实测 1m41s
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maa
          POSTGRES_PASSWORD: maa_secret_pwd
          POSTGRES_DB: multi_agent_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maa -d multi_agent_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE__URL: "postgresql+asyncpg://maa:maa_secret_pwd@localhost:5432/multi_agent_assistant"
      REDIS__URL: "redis://localhost:6379/0"
      JWT_SECRET_KEY: "ci-test-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chroma]"

      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head

      - name: Downgrade one revision
        working-directory: backend
        run: alembic downgrade -1

      - name: Upgrade back to head
        working-directory: backend
        run: alembic upgrade head

      - name: PostgreSQL integration tests
        working-directory: backend
        run: pytest tests/test_task_repository.py -m integration -q

  frontend:
    name: Frontend Unit, Types & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 实测 1m24s
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --run

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Build (vite)
        run: npm run build

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    # 实测 28s（缓存命中）~ 4m47s（冷缓存），差异大所以留足余量
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: maa-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build smoke client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/smoke/Dockerfile
          push: false
          tags: maa-smoke:ci

  smoke:
    name: Compose Release Smoke
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 30  # 实测 3m31s
    steps:
      - uses: actions/checkout@v4

      - name: Run compose smoke (isolated project maa-test)
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -p maa-test -f docker-compose.yml -f docker-compose.smoke.yml --profile test logs --tail 120 || true
