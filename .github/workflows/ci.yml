# 多智能体协作自动化任务助手 - CI 流水线
# 阶段0任务6：从阶段1起每个阶段 CI 必须包含单元测试执行与覆盖率检查
# 覆盖率低于阶段验收标准即视为构建失败

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同一分支的并发任务取消旧的，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Run Black (check formatting)
        working-directory: backend
        run: black --check app tests

      - name: Run Ruff (lint)
        working-directory: backend
        run: ruff check app tests

      - name: Run Mypy (type check, non-blocking)
        working-directory: backend
        run: mypy app || true
        continue-on-error: true

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # 阶段0仅安装测试需要的最小依赖集，避免下载重型模型依赖
          pip install \
            "fastapi>=0.110.0" \
            "uvicorn[standard]>=0.27.0" \
            "pydantic>=2.6.0" \
            "pydantic-settings>=2.1.0" \
            "PyYAML>=6.0.1" \
            "sqlalchemy[asyncio]>=2.0.25" \
            "asyncpg>=0.29.0" \
            "redis>=5.0.0" \
            "structlog>=24.1.0" \
            "python-jose[cryptography]>=3.3.0" \
            "passlib[bcrypt]>=1.7.4" \
            "python-multipart>=0.0.9" \
            "websockets>=12.0" \
            "httpx>=0.26.0" \
            "tenacity>=8.2.3" \
            "networkx>=3.2.1" \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.23.5" \
            "pytest-cov>=4.1.0"

      - name: Run pytest with coverage
        working-directory: backend
        env:
          APP_ENV: test
          # pydantic-settings 嵌套分隔符为 __ ，映射到 settings.database.url
          DATABASE__URL: "sqlite+aiosqlite:///:memory:"
          REDIS__URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production"
        run: |
          pytest tests \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: warn

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    # 仅验证 Dockerfile 可构建，不推送镜像
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: maa-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
