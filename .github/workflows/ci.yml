# 多智能体协作自动化任务助手 - CI 流水线
# 阶段0任务6：从阶段1起每个阶段 CI 必须包含单元测试执行与覆盖率检查
# 覆盖率低于阶段验收标准即视为构建失败

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同一分支的并发任务取消旧的，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          # 固定版本与 .pre-commit-config.yaml 保持一致，确保本地与 CI 格式化结果可复现
          pip install black==24.4.2 ruff==0.4.4 mypy==1.10.0

      - name: Run Black (check formatting)
        working-directory: backend
        run: black --check app tests

      - name: Run Ruff (lint)
        working-directory: backend
        run: ruff check app tests

      - name: Run Mypy (type check, non-blocking)
        working-directory: backend
        run: mypy app || true
        continue-on-error: true

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # 阶段1：安装运行时依赖 + 测试依赖
          # 注意：passlib 已移除，改用 bcrypt 直接哈希；新增 email-validator
          # 依赖列表需与 backend/pyproject.toml 保持同步，避免遗漏导致 import 失败
          # 阶段5新增 RAG 测试必需包：chromadb(向量库)、jieba(中文分词)、rank-bm25(BM25 索引)
          # 重型可选包(sentence-transformers/FlagEmbedding/PyMuPDF/python-docx)在测试中通过
          # sys.modules mock 注入避开，无需在 CI 安装以节省时间
          pip install \
            "fastapi>=0.110.0" \
            "uvicorn[standard]>=0.27.0" \
            "pydantic>=2.6.0" \
            "pydantic-settings>=2.1.0" \
            "email-validator>=2.0.0" \
            "PyYAML>=6.0.1" \
            "sqlalchemy[asyncio]>=2.0.25" \
            "asyncpg>=0.29.0" \
            "alembic>=1.13.0" \
            "redis>=5.0.0" \
            "structlog>=24.1.0" \
            "python-jose[cryptography]>=3.3.0" \
            "bcrypt>=4.0.0" \
            "python-multipart>=0.0.9" \
            "websockets>=12.0" \
            "httpx>=0.26.0" \
            "tenacity>=8.2.3" \
            "networkx>=3.2.1" \
            "openai>=1.12.0" \
            "jinja2>=3.1.3" \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.23.5" \
            "pytest-cov>=4.1.0" \
            "aiosqlite>=0.19.0" \
            "fakeredis>=2.21.0" \
            "lupa>=2.0" \
            "chromadb>=0.4.22" \
            "jieba>=0.42.1" \
            "rank-bm25>=0.2.2"

      - name: Run pytest with coverage
        working-directory: backend
        env:
          APP_ENV: test
          # pydantic-settings 嵌套分隔符为 __ ，映射到 settings.database.url
          DATABASE__URL: "sqlite+aiosqlite:///:memory:"
          REDIS__URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production"
        run: |
          pytest tests \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: warn

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    # 仅验证 Dockerfile 可构建，不推送镜像
    # build context 为仓库根（pyproject readme 指向 ../README.md）
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: maa-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
